name: Build iOS (simulateur)

# Vérifie que le projet compile, sans certificat ni compte Apple Developer :
# une build pour le simulateur iOS ne nécessite aucune signature de code.
# Utile car cette PR a été écrite sans accès à un Mac pour compiler localement.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Sélectionner Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet Xcode
        run: xcodegen generate

      - name: Build pour le simulateur
        run: |
          xcodebuild build \
            -project AppFamille.xcodeproj \
            -scheme AppFamille \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
